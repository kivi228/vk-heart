<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>❤️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            height: 100vh;
            width: 100vw;
            background: #050508;
            overflow: hidden;
            position: relative;
        }

        .heart-particle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            will-change: transform, opacity;
            filter: drop-shadow(0 0 10px rgba(255, 0, 100, 0.6));
        }
    </style>
</head>
<body>

    <!-- Векторные слои с неоновыми градиентами -->
    <svg width="0" height="0" style="position:absolute;">
        <defs>
            <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff0055" />
                <stop offset="100%" stop-color="#7a00ff" />
            </linearGradient>
            <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff2a85" />
                <stop offset="100%" stop-color="#ff7300" />
            </linearGradient>
            <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00f0ff" />
                <stop offset="100%" stop-color="#ff0066" />
            </linearGradient>
            <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff0000" />
                <stop offset="50%" stop-color="#ff00b7" />
                <stop offset="100%" stop-color="#ffffff" />
            </linearGradient>
        </defs>
    </svg>

    <script>
        const gradients = ['url(#g1)', 'url(#g2)', 'url(#g3)', 'url(#g4)'];

        function getHeartSVG(size, grad) {
            return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="${grad}"/></svg>`;
        }

        function spawnHeart(originX, originY) {
            const el = document.createElement('div');
            el.className = 'heart-particle';

            const size = Math.floor(25 + Math.random() * 65); // Крупные сердечки разных размеров
            const grad = gradients[Math.floor(Math.random() * gradients.length)];
            
            el.innerHTML = getHeartSVG(size, grad);
            document.body.appendChild(el);

            // Траектории полета во ВСЕ стороны экрана
            const angle = Math.random() * Math.PI * 2;
            const distance = 150 + Math.random() * (window.innerWidth > window.innerHeight ? window.innerWidth : window.innerHeight);
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;
            const rot = (Math.random() - 0.5) * 1000;
            const duration = 1200 + Math.random() * 1000;

            const anim = el.animate([
                {
                    transform: `translate(${originX}px, ${originY}px) scale(0.1) rotate(0deg)`,
                    opacity: 1
                },
                {
                    transform: `translate(${originX + tx * 0.5}px, ${originY + ty * 0.5}px) scale(1.3) rotate(${rot * 0.5}deg)`,
                    opacity: 1,
                    offset: 0.4
                },
                {
                    transform: `translate(${originX + tx}px, ${originY + ty}px) scale(0) rotate(${rot}deg)`,
                    opacity: 0
                }
            ], {
                duration: duration,
                easing: 'cubic-bezier(0.12, 0, 0.39, 0) '
            });

            anim.onfinish = () => el.remove();
        }

        // АДСКИЙ ЗАПУСК - спавним тысячи сердечек из центра и случайных точек
        function unleashHell() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            // Первичный массовый взрыв из центра
            for (let i = 0; i < 150; i++) {
                setTimeout(() => {
                    spawnHeart(centerX, centerY);
                }, Math.random() * 300);
            }

            // Непрерывный пулеметный спавн по всему экрану
            setInterval(() => {
                for(let i = 0; i < 8; i++) {
                    const rx = Math.random() * window.innerWidth;
                    const ry = Math.random() * window.innerHeight;
                    spawnHeart(rx, ry);
                }
            }, 60);
        }

        // Запуск сразу при загрузке страницы
        window.addEventListener('DOMContentLoaded', unleashHell);
    </script>
</body>
</html>
