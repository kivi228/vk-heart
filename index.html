<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Секретный архив</title>
    <!-- Подключаем библиотеку для интеграции с ВК -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Helvetica Neue", Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Идеальная маскировка под стандартную ссылку ВКонтакте */
        .vk-link {
            background: none !important;
            border: none !important;
            color: #2975cc !important; /* Родной синий цвет ссылок ВК */
            text-decoration: none !important;
            font-size: 17px !important;
            font-weight: 400;
            cursor: pointer !important;
            padding: 20px !important;
            display: inline-block;
            -webkit-tap-highlight-color: transparent; /* Убирает темное выделение на iPhone при тапе */
        }

        .vk-link:active {
            opacity: 0.7; /* Эффект зажатия как на iOS */
        }

        .heart-particle {
            position: fixed;
            pointer-events: none;
            font-size: 26px;
            z-index: 9999;
            transition: transform 0.7s cubic-bezier(0.1, 0.8, 0.25, 1), opacity 0.7s ease-out;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

    <!-- Ссылка-обманка. Текст внутри можете поменять на свой -->
    <button class="vk-link" id="clickBtn">Перейти к скрытому архиву</button>

    <script>
        // Инициализируем связь с приложением ВК
        vkBridge.send('VKWebAppInit');

        const button = document.getElementById('clickBtn');

        // Обрабатываем touchstart для мгновенного отклика на iPhone
        button.addEventListener('touchstart', function(e) {
            e.preventDefault();
            triggerExplosion(e.touches[0].clientX, e.touches[0].clientY);
        });

        button.addEventListener('click', function(e) {
            triggerExplosion(e.clientX, e.clientY);
        });

        function triggerExplosion(startX, startY) {
            const colors = ['#ff334b', '#ff5e7e', '#ff1a75', '#ff4d4d', '#e6005c'];

            // Вызываем легкую вибрацию на iPhone через систему ВК
            vkBridge.send('VKWebAppTapticNotificationOccurred', {type: 'success'});

            // Генерируем 22 летящих сердечка
            for (let i = 0; i < 22; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerText = '❤️';
                
                heart.style.left = startX + 'px';
                heart.style.top = startY + 'px';
                heart.style.color = colors[Math.floor(Math.random() * colors.length)];
                heart.style.fontSize = (16 + Math.random() * 18) + 'px';

                document.body.appendChild(heart);

                const angle = Math.random() * Math.PI * 2;
                const distance = 40 + Math.random() * 140;
                const targetX = Math.cos(angle) * distance;
                const targetY = Math.sin(angle) * distance;

                setTimeout(() => {
                    heart.style.transform = `translate(calc(-50% + ${targetX}px), calc(-50% + ${targetY}px)) scale(0)`;
                    heart.style.opacity = '0';
                }, 10);

                setTimeout(() => {
                    heart.remove();
                }, 700);
            }
        }
    </script>
</body>
</html>
