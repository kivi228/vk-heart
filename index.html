<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Секретная ссылка</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d0d11;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .container {
            text-align: center;
            padding: 20px;
            z-index: 2;
        }

        /* Замаскированная кнопка-ссылка */
        .fake-link {
            background: none;
            border: none;
            color: #4f92ff;
            text-decoration: underline;
            font-size: 22px;
            font-weight: 600;
            cursor: pointer;
            padding: 15px 25px;
            outline: none;
            transition: color 0.2s;
        }

        .fake-link:active {
            color: #ff3366;
        }

        /* Контейнер для частиц */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            will-change: transform, opacity;
        }
    </style>
</head>
<body>

    <div class="container">
        <button class="fake-link" id="targetBtn">Скачать секретный файл</button>
    </div>

    <!-- Векторные шаблоны сердец с 3D-градиентами -->
    <svg width="0" height="0" style="position:absolute;">
        <defs>
            <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff4d6d" />
                <stop offset="50%" stop-color="#ff0055" />
                <stop offset="100%" stop-color="#800020" />
            </linearGradient>
            <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff9ebb" />
                <stop offset="100%" stop-color="#ff3366" />
            </linearGradient>
            <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffea00" />
                <stop offset="100%" stop-color="#ff6d00" />
            </linearGradient>
        </defs>
    </svg>

    <script>
        const btn = document.getElementById('targetBtn');

        // Крупные варианты SVG-сердечек
        const heartTemplates = [
            `<svg width="45" height="45" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#gradRed)"/></svg>`,
            `<svg width="35" height="35" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#gradPink)"/></svg>`,
            `<svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#gradGold)"/></svg>`
        ];

        function explode(x, y) {
            const count = 30; // Количество вылетающих сердец

            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Выбираем случайный размер/цвет из шаблонов
                particle.innerHTML = heartTemplates[Math.floor(Math.random() * heartTemplates.length)];
                document.body.appendChild(particle);

                // Физика разлёта
                const angle = Math.random() * Math.PI * 2;
                const speed = 5 + Math.random() * 12; // Скорость разлёта
                const targetX = Math.cos(angle) * (80 + Math.random() * 140);
                const targetY = Math.sin(angle) * (80 + Math.random() * 140) - 20; // Искривление траектории
                const rotation = (Math.random() - 0.5) * 540; // Вращение
                const scale = 0.6 + Math.random() * 0.8;

                // Запуск анимации
                const animation = particle.animate([
                    {
                        transform: `translate(${x - 20}px, ${y - 20}px) scale(0.2) rotate(0deg)`,
                        opacity: 1
                    },
                    {
                        transform: `translate(${x + targetX * 0.5}px, ${y + targetY * 0.5}px) scale(${scale}) rotate(${rotation * 0.5}deg)`,
                        opacity: 1,
                        offset: 0.3
                    },
                    {
                        transform: `translate(${x + targetX}px, ${y + targetY + 60}px) scale(0) rotate(${rotation}deg)`,
                        opacity: 0
                    }
                ], {
                    duration: 800 + Math.random() * 400,
                    easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)'
                });

                animation.onfinish = () => particle.remove();
            }
        }

        // Обработка касаний для мобильных
        let lastTouch = 0;

        btn.addEventListener('touchstart', (e) => {
            lastTouch = Date.now();
            const touch = e.touches[0];
            explode(touch.clientX, touch.clientY);
        }, { passive: true });

        btn.addEventListener('click', (e) => {
            // Предотвращаем двойной вызов если сработал touchstart
            if (Date.now() - lastTouch < 300) return;
            explode(e.clientX, e.clientY);
        });
    </script>
</body>
</html>
