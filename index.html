<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Секретный архив</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/index.umd.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #09090b;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "VK Sans Display", "Roboto", sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 32px 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            width: 320px;
            max-width: 90%;
        }

        h2 {
            margin: 0 0 8px 0;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        p {
            margin: 0 0 28px 0;
            font-size: 14px;
            color: #71717a;
        }

        .secret-btn {
            background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
            border: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            padding: 16px 32px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(225, 29, 72, 0.35);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
            width: 100%;
        }

        .secret-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.2);
        }

        /* Стиль для частицы */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            will-change: transform, opacity;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="userName">Закрытый доступ</h2>
        <p>Нажми для расшифровки содержимого</p>
        <button class="secret-btn" id="clickBtn">Открыть секрет</button>
    </div>

    <!-- Встроенные 3D Градиенты для сердец -->
    <svg width="0" height="0" style="position:absolute;">
        <defs>
            <linearGradient id="heartGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff4d6d" />
                <stop offset="50%" stop-color="#c9184a" />
                <stop offset="100%" stop-color="#590d22" />
            </linearGradient>
            <linearGradient id="heartGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff85a1" />
                <stop offset="100%" stop-color="#a4133c" />
            </linearGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="2" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>
    </svg>

    <script>
        if (window.vkBridge) {
            vkBridge.send('VKWebAppInit').catch(() => {});
            vkBridge.send('VKWebAppGetUserInfo')
                .then(data => {
                    if (data && data.first_name) {
                        document.getElementById('userName').innerText = `Привет, ${data.first_name}`;
                    }
                })
                .catch(() => {});
        }

        // РЕАЛИСТИЧНЫЕ ВЕКТОРНЫЕ ЭЛЕМЕНТЫ (3D Сердце + Неоновая пыльца)
        const heartSVG1 = `<svg width="32" height="32" viewBox="0 0 24 24" filter="url(#glow)"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#heartGrad1)"/></svg>`;
        const heartSVG2 = `<svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#heartGrad2)"/></svg>`;
        const sparkSVG = `<svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#ffb703"/></svg>`;

        function createExplosion(x, y) {
            if (window.vkBridge) {
                vkBridge.send('VKWebAppTapticImpactOccurred', { style: 'heavy' }).catch(() => {});
            }

            const count = 35; // Количество элементов

            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'particle';
                
                // Шанс выпадения разных типы элементов
                const rand = Math.random();
                if (rand > 0.6) el.innerHTML = heartSVG1;
                else if (rand > 0.25) el.innerHTML = heartSVG2;
                else el.innerHTML = sparkSVG;

                document.body.appendChild(el);

                // Физика вылета
                const angle = Math.random() * Math.PI * 2;
                const speed = 4 + Math.random() * 10;
                const tx = Math.cos(angle) * (60 + Math.random() * 120);
                const ty = Math.sin(angle) * (60 + Math.random() * 120) - 30; // Легкое смещение вверх
                const rot = (Math.random() - 0.5) * 720; // 3D Вращение
                const scale = 0.5 + Math.random() * 0.8;

                // Запуск современной плавного анимации
                const anim = el.animate([
                    { 
                        transform: `translate(${x}px, ${y}px) scale(0.2) rotate(0deg)`, 
                        opacity: 1 
                    },
                    { 
                        transform: `translate(${x + tx * 0.5}px, ${y + ty * 0.5}px) scale(${scale}) rotate(${rot * 0.5}deg)`, 
                        opacity: 0.9,
                        offset: 0.4
                    },
                    { 
                        transform: `translate(${x + tx}px, ${y + ty + 40}px) scale(0) rotate(${rot}deg)`, 
                        opacity: 0 
                    }
                ], {
                    duration: 700 + Math.random() * 500,
                    easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)'
                });

                anim.onfinish = () => el.remove();
            }
        }

        const btn = document.getElementById('clickBtn');

        btn.addEventListener('click', (e) => {
            const rect = btn.getBoundingClientRect();
            const x = e.clientX || (rect.left + rect.width / 2);
            const y = e.clientY || (rect.top + rect.height / 2);

            createExplosion(x, y);
        });
    </script>
</body>
</html>
